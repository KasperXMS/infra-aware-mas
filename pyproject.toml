[project]
name = "infra-aware-mas"
version = "0.1.0"
description = "A minimal infrastructure-aware distributed multi-agent system prototype."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai-agents>=0.2",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[project.scripts]
infra-mas-run = "infra_mas.cli:main"
infra-mas-worker = "infra_mas.worker.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_mas"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests", "experiments"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
