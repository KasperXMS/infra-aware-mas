  task_family: multi_document_qa
  query: What changes have taken place in JD's ESG initiatives over the past four
    years?
  answer_choices:
    A: In terms of supplier management, JD has continuously improved the standards
      and systems related to green procurement by establishing a negative list mechanism
      for green procurement suppliers. In 2022, JD initiated a questionnaire survey
      to evaluate suppliers' ESG (Environmental, Social, and Governance) performance.
      In 2023, JD issued questionnaires to suppliers with higher ESG scores, receiving
      461 valid responses. From 2024 onwards, JD has incorporated ESG clauses into
      supplier contracts, requiring suppliers to make commitments regarding ESG-related
      requirements and strictly abide by the "JD Group Supplier Code of Conduct."
    B: JD strives to ensure a diverse employee demographic structure. In 2020, the
      total number of employees within the JD system reached 360,000, with a proportion
      of 1.5% being employees with disabilities. In 2021, the total number of employees
      surpassed 420,000, among which over 80% hailed from rural areas. By 2022, the
      number declined to 370,000, but the rural population proportion remained at
      80%. In 2023, the cumulative number of employees exceeded 360,000, with a female
      employee ratio of 21%.
    C: JD has made efforts in green operations, including promoting green commuting
      among employees and other initiatives. Since 2016, JD has established a strategic
      partnership with Didi, and in 2021, it forged a cooperation with CaoCao online
      car-hailing platform to provide carpooling services for employees. In 2021,
      the company's self-operated new energy shuttle buses at its headquarters have
      reached 80, with an additional 37 vehicles added in 2022. In response to the
      pandemic, JD has provided remote work systems for its employees, with the number
      of online meetings surpassing 1.6 million in 2021 and soaring to nearly 3.8
      million in 2022. Notably, in 2023 alone, the number of online meetings conducted
      through Joymeeting exceeded 18 million.
    D: In terms of social welfare, JD is dedicated to giving back to society, making
      contributions in various fields such as targeted poverty alleviation, green
      environmental protection, inclusive healthcare, caring for vulnerable groups,
      emergency rescue and disaster relief. In 2021, JD initiated a series of projects
      and established funds in the healthcare sector; in 2022, JD played a vital role
      in ensuring the supply of essential goods during the pandemic; and in 2023,
      JD donated nearly 70,000 books to over one hundred primary schools.
