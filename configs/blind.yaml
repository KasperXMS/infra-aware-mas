# Paths are resolved relative to this file.
planner_mode: hybrid
agents_config: agents.yaml
models_config: models.yaml
executors_config: executors.yaml
runs_root: ../runs
temporary_root: ../.runtime

# Initial artifacts are uploaded here; later movement remains scheduler-driven.
input_worker: orin-1
worker_timeout_seconds: 300
max_turns: 10

scheduler:
  type: fixed
  assignments:
    local-vlm: orin-1-vlm
    remote-vlm: gpu-1-vlm
    remote-llm: gpu-1-llm

planner:
  # Replace this with a model available to your account or compatible server.
  model: replace-with-planner-model
  api: responses
  base_url: null
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 120
