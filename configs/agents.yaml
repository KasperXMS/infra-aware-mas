agents:
  vision_extractor:
    capability: visual_understanding
    model_id: local-vlm
    instructions: >
      Extract visual evidence relevant to the assigned task.
  summarizer:
    capability: summarization
    model_id: remote-llm
    instructions: >
      Compress supplied information while preserving task-relevant evidence.
  reasoner:
    capability: reasoning
    model_id: remote-llm
    instructions: >
      Reason over supplied evidence and solve the assigned task.
