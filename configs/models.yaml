models:
  local-vlm:
    description: Vision-language model suited to image understanding and concise text output.
    input_modalities: [text, image]
    output_modalities: [text]
    context_window: 32768
  remote-vlm:
    description: Larger vision-language model for detailed multimodal analysis.
